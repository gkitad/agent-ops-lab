# Agent Ops Lab: a small, real CRM stack the agent operates on.
# Every service is a real process; faults are injected for real.
name: lab

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  certs:

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "2m", max-file: "2" }

services:
  certs-init:
    build: ./tools
    command: ["python", "/tools/make_certs.py", "/certs"]
    volumes: ["certs:/certs"]
    network_mode: none
    restart: "no"

  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
      - ./dns/runtime:/zones
    networks:
      lab: { ipv4_address: 172.30.0.53 }
    restart: unless-stopped
    mem_limit: 64m
    <<: *logging

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in lab/.env}
      POSTGRES_DB: crm
    command: ["postgres", "-c", "max_connections=40", "-c", "log_min_messages=warning", "-c", "log_line_prefix=%m [%p] "]
    tmpfs:
      - /var/lib/postgresql/data:size=160m
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      lab: { ipv4_address: 172.30.0.21 }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "crm"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    <<: *logging

  app1: &app
    build: ./app
    hostname: crm-app-01
    environment:
      APP_NAME: crm-app-01
      DATABASE_URL: postgresql://crm:${DB_PASSWORD}@172.30.0.21:5432/crm
    networks:
      lab: { ipv4_address: 172.30.0.11 }
    depends_on:
      db: { condition: service_healthy }
    # No auto-restart: a crashed app server stays down until someone fixes it.
    restart: "no"
    mem_limit: 96m
    <<: *logging

  app2:
    <<: *app
    hostname: crm-app-02
    environment:
      APP_NAME: crm-app-02
      DATABASE_URL: postgresql://crm:${DB_PASSWORD}@172.30.0.21:5432/crm
    networks:
      lab: { ipv4_address: 172.30.0.12 }

  edge:
    image: nginx:1.27-alpine
    hostname: lb-01
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs
    networks:
      lab: { ipv4_address: 172.30.0.40 }
    depends_on:
      certs-init: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 64m
    <<: *logging

  client:
    build: ./tools
    hostname: office-pc
    command: ["sleep", "infinity"]
    dns: [172.30.0.53]
    dns_search: []
    volumes: ["certs:/certs:ro"]
    networks:
      lab: { ipv4_address: 172.30.0.100 }
    restart: unless-stopped
    mem_limit: 96m
    <<: *logging
