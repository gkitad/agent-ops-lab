worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
  log_format main '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';
  access_log /dev/stdout main;

  upstream crm_app {
    server 172.30.0.11:8080 max_fails=0;
    server 172.30.0.12:8080 max_fails=0;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name crm.lab.internal;
    ssl_certificate     /certs/live/crm.crt;
    ssl_certificate_key /certs/live/crm.key;

    location / {
      proxy_pass http://crm_app;
      proxy_next_upstream off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }
  }
}
